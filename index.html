<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Banca</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#060608;--surface:#0d0d10;--surface2:#111115;--surface3:#16161b;--border:#1e1e26;--border2:#252530;--text:#eeeef2;--muted:#6b6b80;--muted2:#9090a8;--green:#00e87a;--green-dim:rgba(0,232,122,.12);--green-glow:rgba(0,232,122,.3);--red:#ff4757;--red-dim:rgba(255,71,87,.12);--amber:#ffa94d;--radius:14px}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;overflow-x:hidden}body:before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,232,122,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,232,122,.02) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}body:after{content:'';position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:700px;height:400px;background:radial-gradient(ellipse,rgba(0,232,122,.06),transparent 70%);pointer-events:none}.wrapper{position:relative;z-index:1;max-width:1360px;margin:auto;padding:40px 30px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px;padding-bottom:24px;border-bottom:1px solid var(--border)}.logo{display:flex;align-items:center;gap:14px}.logo-icon{width:42px;height:42px;background:linear-gradient(135deg,var(--green),#00b856);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 0 20px var(--green-glow)}.logo-text{font-size:20px;font-weight:800}.logo-text span{color:var(--green)}.header-badge{background:var(--green-dim);border:1px solid rgba(0,232,122,.25);color:var(--green);font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;letter-spacing:1.5px;font-family:'JetBrains Mono',monospace}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}.metric-card,.card,.form-card,.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}.metric-card{padding:20px 22px;position:relative}.metric-label,.input-label{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;font-family:'JetBrains Mono',monospace}.metric-label{margin-bottom:10px}.metric-value{font-size:26px;font-weight:800;font-family:'JetBrains Mono',monospace}.metric-sub{font-size:11px;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace}.metric-icon{position:absolute;right:18px;top:18px;opacity:.15}.main-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}.card,.form-card,.chart-card{padding:22px}.card-title{font-size:13px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:18px;display:flex;align-items:center;gap:8px}.card-title:before{content:'';width:3px;height:14px;background:var(--green);border-radius:2px}.table-wrap{overflow:auto;max-height:520px;-webkit-overflow-scrolling:touch}table{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;min-width:780px}thead{position:sticky;top:0;z-index:2}th{background:var(--surface);text-align:left;font-size:10px;color:var(--muted);letter-spacing:1.5px;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}td{padding:11px 14px;font-size:13px;color:var(--muted2);border-bottom:1px solid var(--border);white-space:nowrap}td:first-child{color:var(--text);font-weight:600}tr.current-day td{background:rgba(0,232,122,.07);color:var(--text)}.pill{display:inline-flex;padding:3px 9px;border-radius:6px;font-size:12px;font-weight:600}.pill-green{background:var(--green-dim);color:var(--green)}.pill-red{background:var(--red-dim);color:var(--red)}.sidebar{display:flex;flex-direction:column;gap:16px}.input-group{margin-bottom:14px}.input-label{display:block;margin-bottom:7px}.input-row{position:relative}.input-prefix{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace}input{width:100%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:11px 14px 11px 32px;border-radius:9px;font-size:14px;font-weight:600;font-family:'JetBrains Mono',monospace;outline:none}.btn{width:100%;padding:14px;border:0;border-radius:9px;background:linear-gradient(135deg,var(--green),#00c46a);color:#000;font-size:14px;font-weight:800;cursor:pointer}.divider{height:1px;background:var(--border);margin:14px 0}.progress-wrap{margin-top:18px}.progress-header{display:flex;justify-content:space-between;margin-bottom:8px}.progress-label,.progress-pct{font-size:11px;font-family:'JetBrains Mono',monospace}.progress-label{color:var(--muted)}.progress-pct{color:var(--green);font-weight:700}.progress-track{height:6px;background:var(--surface3);border-radius:20px;overflow:hidden}.progress-bar{height:100%;background:var(--green);width:0;transition:width .5s}.chart-wrap{height:180px}.day-badge{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;background:var(--green-dim);color:var(--green);border-radius:6px;font-size:11px;font-weight:700}@media(max-width:1100px){.main-grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.sidebar{display:grid;grid-template-columns:1fr 1fr}.chart-wrap{height:280px}}@media(max-width:600px){.wrapper{padding:18px 12px}.metrics{grid-template-columns:1fr 1fr;gap:10px}.metric-card{padding:16px 12px}.metric-value{font-size:18px}.metric-icon{display:none}header{margin-bottom:20px}.main-grid{gap:12px}.card,.form-card,.chart-card{padding:15px}.sidebar{display:flex}.chart-wrap{height:220px}th,td{padding:10px 9px}.logo-text{font-size:18px}.header-badge{font-size:9px}}
</style></head><body><div class="wrapper"><header><div class="logo"><div class="logo-icon">📈</div><div><div class="logo-text">Banca<span>Pro</span></div><div style="font-size:11px;color:var(--muted);font-family:'JetBrains Mono'">Gerenciamento de banca</div></div></div><div class="header-badge">● AO VIVO</div></header><div class="metrics"><div class="metric-card"><div class="metric-icon">💰</div><div class="metric-label">Banca Atual</div><div class="metric-value" id="mBanca">R$0</div><div class="metric-sub" id="mBancaSub"></div></div><div class="metric-card"><div class="metric-icon">📊</div><div class="metric-label">Lucro Total</div><div class="metric-value" id="mLucro" style="color:var(--green)">R$0</div><div class="metric-sub" id="mLucroSub"></div></div><div class="metric-card"><div class="metric-icon">⚡</div><div class="metric-label">ROI</div><div class="metric-value" id="mRoi">0%</div><div class="metric-sub">retorno sobre inicial</div></div><div class="metric-card"><div class="metric-icon">🎯</div><div class="metric-label">Meta dia 30</div><div class="metric-value" id="mMeta30" style="color:var(--amber)">R$0</div><div class="metric-sub">projeção final</div></div></div><div class="main-grid"><div class="card"><div class="card-title">Projeção 30 dias</div><div class="table-wrap"><table><thead><tr><th>Dia</th><th>Banca Inicial</th><th>Meta Diária</th><th>Lucro</th><th>Banca Final</th><th>Stop Loss</th><th>× Inicial</th></tr></thead><tbody id="tbody"></tbody></table></div></div><div class="sidebar"><div class="form-card"><div class="card-title">Configurar</div><div class="input-group"><label class="input-label">Banca Inicial</label><div class="input-row"><span class="input-prefix">R$</span><input type="number" id="iInicial" value="50"></div></div><div class="input-group"><label class="input-label">Meta Diária</label><div class="input-row"><span class="input-prefix">%</span><input type="number" id="iMeta" value="50"></div></div><div class="input-group"><label class="input-label">Stop Loss</label><div class="input-row"><span class="input-prefix">%</span><input type="number" id="iStop" value="60"></div></div><div class="input-group"><label class="input-label">Dia Atual</label><div class="input-row"><span class="input-prefix">#</span><input type="number" id="iDia" value="1" min="1" max="30"></div></div><div class="divider"></div><button class="btn" onclick="calcular()">⚡ Calcular Projeção</button><div class="progress-wrap"><div class="progress-header"><span class="progress-label">PROGRESSO</span><span class="progress-pct" id="pct">0%</span></div><div class="progress-track"><div class="progress-bar" id="progressBar"></div></div></div></div><div class="chart-card"><div class="card-title">Curva da Banca</div><div class="chart-wrap"><canvas id="grafico"></canvas></div></div></div></div></div><script>
let chartInstance=null;const fmt=v=>'R$'+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});function calcular(){const inicial=Math.max(0,parseFloat(document.getElementById('iInicial').value)||0);const metaPct=(parseFloat(document.getElementById('iMeta').value)||0)/100;const stopPct=(parseFloat(document.getElementById('iStop').value)||0)/100;const diaAtual=Math.min(30,Math.max(1,parseInt(document.getElementById('iDia').value)||1));let banca=inicial;const rows=[];for(let d=1;d<=30;d++){const lucro=banca*metaPct,final=banca+lucro,stop=banca*stopPct;rows.push({dia:d,inicial:banca,lucro,final,stop,mult:inicial?final/inicial:0});banca=final}const tbody=document.getElementById('tbody');tbody.innerHTML=rows.map(r=>`<tr class="${r.dia===diaAtual?'current-day':''}"><td>${r.dia===diaAtual?`<span class="day-badge">${r.dia}</span>`:r.dia}</td><td>${fmt(r.inicial)}</td><td><span class="pill pill-green">+${(metaPct*100).toFixed(0)}%</span></td><td><span class="pill pill-green">+${fmt(r.lucro)}</span></td><td style="color:var(--text);font-weight:700">${fmt(r.final)}</td><td><span class="pill pill-red">-${fmt(r.stop)}</span></td><td style="color:var(--amber)">${r.mult.toFixed(1)}×</td></tr>`).join('');const current=rows[diaAtual-1],final30=rows[29],lucroAcum=current.final-inicial,roi=inicial?(lucroAcum/inicial)*100:0;document.getElementById('mBanca').textContent=fmt(current.final);document.getElementById('mBancaSub').textContent=`dia ${diaAtual} de 30`;document.getElementById('mLucro').textContent=fmt(lucroAcum);document.getElementById('mLucroSub').textContent=`+${roi.toFixed(1)}% desde o início`;document.getElementById('mRoi').textContent=roi.toFixed(1)+'%';document.getElementById('mMeta30').textContent=fmt(final30.final);const pct=Math.round(diaAtual/30*100);document.getElementById('pct').textContent=pct+'%';document.getElementById('progressBar').style.width=pct+'%';if(chartInstance)chartInstance.destroy();const ctx=document.getElementById('grafico').getContext('2d'),gradient=ctx.createLinearGradient(0,0,0,220);gradient.addColorStop(0,'rgba(0,232,122,.25)');gradient.addColorStop(1,'rgba(0,232,122,0)');chartInstance=new Chart(ctx,{type:'line',data:{labels:rows.map(r=>'D'+r.dia),datasets:[{data:rows.map(r=>r.final),borderColor:'#00e87a',backgroundColor:gradient,borderWidth:2,pointRadius:rows.map((_,i)=>i===diaAtual-1?5:0),fill:true,tension:.4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#6b6b80',maxTicksLimit:8},grid:{color:'rgba(255,255,255,.03)'}},y:{ticks:{color:'#6b6b80',callback:v=>'R$'+v.toLocaleString('pt-BR')},grid:{color:'rgba(255,255,255,.04)'}}}}})}calcular();['iInicial','iMeta','iStop','iDia'].forEach(id=>document.getElementById(id).addEventListener('input',calcular));
</script></body></html>
