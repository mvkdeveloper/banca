<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060608">
<title>BancaPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>
:root{--bg:#060608;--surface:#0d0d10;--surface2:#111115;--surface3:#16161b;--border:#1e1e26;--border2:#292934;--text:#eeeef2;--muted:#6b6b80;--muted2:#9090a8;--green:#00e87a;--green-dim:rgba(0,232,122,.12);--green-glow:rgba(0,232,122,.3);--red:#ff4757;--red-dim:rgba(255,71,87,.12);--amber:#ffa94d;--radius:14px}*{margin:0;padding:0;box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;overflow-x:hidden}body:before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,232,122,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,232,122,.02) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}.wrapper{position:relative;z-index:1;max-width:1360px;margin:auto;padding:40px 30px;padding-bottom:max(30px,env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px;padding-bottom:24px;border-bottom:1px solid var(--border)}.logo{display:flex;align-items:center;gap:14px}.logo-icon{width:44px;height:44px;background:linear-gradient(135deg,var(--green),#00b856);border-radius:12px;display:grid;place-items:center;color:#04150d;box-shadow:0 0 20px var(--green-glow)}.icon{width:20px;height:20px;stroke-width:2}.logo-text{font-size:20px;font-weight:800}.logo-text span{color:var(--green)}.logo-sub{font:11px 'JetBrains Mono';color:var(--muted);margin-top:2px}.header-badge{display:flex;align-items:center;gap:7px;background:var(--green-dim);border:1px solid rgba(0,232,122,.25);color:var(--green);font:600 11px 'JetBrains Mono';padding:6px 11px;border-radius:20px;letter-spacing:1px}.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}.metric-card,.card,.form-card,.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}.metric-card{padding:20px 22px;position:relative;overflow:hidden}.metric-icon{position:absolute;right:16px;top:16px;width:34px;height:34px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;color:var(--muted2)}.metric-icon .icon{width:17px;height:17px}.metric-label,.input-label{font:600 10px 'JetBrains Mono';color:var(--muted);letter-spacing:1.3px;text-transform:uppercase}.metric-label{margin-bottom:10px}.metric-value{font:800 25px 'JetBrains Mono';letter-spacing:-1px;padding-right:32px}.metric-sub{font:11px 'JetBrains Mono';color:var(--muted);margin-top:5px}.main-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}.card,.form-card,.chart-card{padding:22px}.card-title{font-size:13px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:1.3px;margin-bottom:18px;display:flex;align-items:center;gap:9px}.card-title .icon{width:16px;height:16px;color:var(--green)}.table-wrap{overflow:auto;max-height:520px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--border2) transparent}table{width:100%;border-collapse:collapse;font-family:'JetBrains Mono';min-width:760px}thead{position:sticky;top:0;z-index:2}th{background:var(--surface);text-align:left;font-size:10px;color:var(--muted);letter-spacing:1px;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}td{padding:11px 14px;font-size:13px;color:var(--muted2);border-bottom:1px solid var(--border);white-space:nowrap}tr.current-day td{background:rgba(0,232,122,.07);color:var(--text)}.pill{display:inline-flex;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:600}.pill-green{background:var(--green-dim);color:var(--green)}.pill-red{background:var(--red-dim);color:var(--red)}.sidebar{display:flex;flex-direction:column;gap:16px}.input-group{margin-bottom:14px}.input-label{display:block;margin-bottom:7px}.input-row{position:relative}.input-prefix{position:absolute;left:12px;top:50%;transform:translateY(-50%);font:12px 'JetBrains Mono';color:var(--muted);pointer-events:none}input{width:100%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:12px 14px 12px 34px;border-radius:10px;font:600 16px 'JetBrains Mono';outline:none;min-height:46px}input:focus{border-color:rgba(0,232,122,.5);box-shadow:0 0 0 3px rgba(0,232,122,.07)}.btn{width:100%;min-height:48px;padding:13px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--green),#00c46a);color:#00180c;font-size:14px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}.btn .icon{width:18px;height:18px}.divider{height:1px;background:var(--border);margin:16px 0}.progress-wrap{margin-top:18px}.progress-header{display:flex;justify-content:space-between;margin-bottom:8px}.progress-label,.progress-pct{font:11px 'JetBrains Mono'}.progress-label{color:var(--muted)}.progress-pct{color:var(--green);font-weight:700}.progress-track{height:7px;background:var(--surface3);border-radius:20px;overflow:hidden}.progress-bar{height:100%;background:linear-gradient(90deg,var(--green),#00c46a);width:0;transition:width .5s}.chart-wrap{height:190px}.day-badge{display:inline-grid;place-items:center;width:26px;height:26px;background:var(--green-dim);border:1px solid rgba(0,232,122,.25);color:var(--green);border-radius:7px;font-size:11px;font-weight:700}@media(max-width:1100px){.main-grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.sidebar{display:grid;grid-template-columns:1fr 1fr}.chart-wrap{height:280px}}@media(max-width:600px){body:before{background-size:40px 40px}.wrapper{padding:18px 12px;padding-top:max(18px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom))}header{margin-bottom:16px;padding-bottom:16px}.logo{gap:10px}.logo-icon{width:40px;height:40px}.logo-text{font-size:18px}.logo-sub{font-size:9px}.header-badge{font-size:9px;padding:5px 8px}.metrics{grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}.metric-card{padding:14px 12px;min-height:112px}.metric-label{font-size:9px;letter-spacing:.8px;padding-right:25px}.metric-value{font-size:17px;padding-right:0;letter-spacing:-.7px;overflow-wrap:anywhere}.metric-sub{font-size:9px;line-height:1.35}.metric-icon{right:10px;top:10px;width:27px;height:27px}.metric-icon .icon{width:14px;height:14px}.main-grid{gap:12px}.card,.form-card,.chart-card{padding:14px;border-radius:12px}.card-title{font-size:11px;margin-bottom:13px}.sidebar{display:flex}.table-wrap{margin:0 -14px;padding:0 14px;max-height:430px}table{min-width:690px}th,td{padding:10px 9px;font-size:11px}th{font-size:9px}.pill{font-size:10px;padding:3px 6px}.chart-wrap{height:210px}.input-group{margin-bottom:11px}.input-label{font-size:9px}.btn{min-height:50px}.day-badge{width:24px;height:24px}}@media(max-width:370px){.metrics{grid-template-columns:1fr}.metric-card{min-height:auto}.metric-value{font-size:20px}}
</style></head><body><div class="wrapper"><header><div class="logo"><div class="logo-icon"><i data-lucide="chart-no-axes-combined" class="icon"></i></div><div><div class="logo-text">Banca<span>Pro</span></div><div class="logo-sub">Gerenciamento de banca</div></div></div><div class="header-badge"><span class="live-dot"></span>AO VIVO</div></header><div class="metrics"><div class="metric-card"><div class="metric-icon"><i data-lucide="wallet-cards" class="icon"></i></div><div class="metric-label">Banca Atual</div><div class="metric-value" id="mBanca">R$0</div><div class="metric-sub" id="mBancaSub"></div></div><div class="metric-card"><div class="metric-icon"><i data-lucide="trending-up" class="icon"></i></div><div class="metric-label">Lucro Total</div><div class="metric-value" id="mLucro" style="color:var(--green)">R$0</div><div class="metric-sub" id="mLucroSub"></div></div><div class="metric-card"><div class="metric-icon"><i data-lucide="percent" class="icon"></i></div><div class="metric-label">ROI</div><div class="metric-value" id="mRoi">0%</div><div class="metric-sub">retorno sobre inicial</div></div><div class="metric-card"><div class="metric-icon"><i data-lucide="target" class="icon"></i></div><div class="metric-label">Meta dia 30</div><div class="metric-value" id="mMeta30" style="color:var(--amber)">R$0</div><div class="metric-sub">projeção final</div></div></div><div class="main-grid"><div class="card"><div class="card-title"><i data-lucide="table-2" class="icon"></i>Projeção 30 dias</div><div class="table-wrap"><table><thead><tr><th>Dia</th><th>Banca Inicial</th><th>Meta</th><th>Lucro</th><th>Banca Final</th><th>Stop Loss</th><th>× Inicial</th></tr></thead><tbody id="tbody"></tbody></table></div></div><div class="sidebar"><div class="form-card"><div class="card-title"><i data-lucide="sliders-horizontal" class="icon"></i>Configurar</div><div class="input-group"><label class="input-label">Banca Inicial</label><div class="input-row"><span class="input-prefix">R$</span><input type="number" inputmode="decimal" id="iInicial" value="50"></div></div><div class="input-group"><label class="input-label">Meta Diária</label><div class="input-row"><span class="input-prefix">%</span><input type="number" inputmode="decimal" id="iMeta" value="50"></div></div><div class="input-group"><label class="input-label">Stop Loss</label><div class="input-row"><span class="input-prefix">%</span><input type="number" inputmode="decimal" id="iStop" value="60"></div></div><div class="input-group"><label class="input-label">Dia Atual</label><div class="input-row"><span class="input-prefix">#</span><input type="number" inputmode="numeric" id="iDia" value="1" min="1" max="30"></div></div><div class="divider"></div><button class="btn" onclick="calcular()"><i data-lucide="calculator" class="icon"></i>Calcular Projeção</button><div class="progress-wrap"><div class="progress-header"><span class="progress-label">PROGRESSO</span><span class="progress-pct" id="pct">0%</span></div><div class="progress-track"><div class="progress-bar" id="progressBar"></div></div></div></div><div class="chart-card"><div class="card-title"><i data-lucide="line-chart" class="icon"></i>Curva da Banca</div><div class="chart-wrap"><canvas id="grafico"></canvas></div></div></div></div></div><script>
let chartInstance=null;const fmt=v=>'R$'+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});function calcular(){const inicial=Math.max(0,Number(document.getElementById('iInicial').value)||0),metaPct=(Number(document.getElementById('iMeta').value)||0)/100,stopPct=(Number(document.getElementById('iStop').value)||0)/100,diaAtual=Math.min(30,Math.max(1,parseInt(document.getElementById('iDia').value)||1));let banca=inicial;const rows=[];for(let d=1;d<=30;d++){const lucro=banca*metaPct,final=banca+lucro,stop=banca*stopPct;rows.push({dia:d,inicial:banca,lucro,final,stop,mult:inicial?final/inicial:0});banca=final}const tbody=document.getElementById('tbody');tbody.innerHTML=rows.map(r=>`<tr class="${r.dia===diaAtual?'current-day':''}"><td>${r.dia===diaAtual?`<span class="day-badge">${r.dia}</span>`:r.dia}</td><td>${fmt(r.inicial)}</td><td><span class="pill pill-green">+${(metaPct*100).toFixed(0)}%</span></td><td><span class="pill pill-green">+${fmt(r.lucro)}</span></td><td style="color:var(--text);font-weight:700">${fmt(r.final)}</td><td><span class="pill pill-red">-${fmt(r.stop)}</span></td><td style="color:var(--amber)">${r.mult.toFixed(1)}×</td></tr>`).join('');const current=rows[diaAtual-1],final30=rows[29],lucroAcum=current.final-inicial,roi=inicial?lucroAcum/inicial*100:0;document.getElementById('mBanca').textContent=fmt(current.final);document.getElementById('mBancaSub').textContent=`dia ${diaAtual} de 30`;document.getElementById('mLucro').textContent=fmt(lucroAcum);document.getElementById('mLucroSub').textContent=`${roi>=0?'+':''}${roi.toFixed(1)}% desde o início`;const roiEl=document.getElementById('mRoi');roiEl.textContent=roi.toFixed(1)+'%';roiEl.style.color=roi>=0?'var(--green)':'var(--red)';document.getElementById('mMeta30').textContent=fmt(final30.final);const pct=Math.round(diaAtual/30*100);document.getElementById('pct').textContent=pct+'%';document.getElementById('progressBar').style.width=pct+'%';if(chartInstance)chartInstance.destroy();const ctx=document.getElementById('grafico').getContext('2d'),gradient=ctx.createLinearGradient(0,0,0,220);gradient.addColorStop(0,'rgba(0,232,122,.25)');gradient.addColorStop(1,'rgba(0,232,122,0)');chartInstance=new Chart(ctx,{type:'line',data:{labels:rows.map(r=>'D'+r.dia),datasets:[{data:rows.map(r=>Number(r.final.toFixed(2))),borderColor:'#00e87a',backgroundColor:gradient,borderWidth:2,pointRadius:rows.map((_,i)=>i===diaAtual-1?5:0),pointBackgroundColor:'#00e87a',fill:true,tension:.4}]},options:{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:'index'},plugins:{legend:{display:false},tooltip:{callbacks:{label:item=>fmt(item.raw)}}},scales:{x:{ticks:{color:'#6b6b80',maxTicksLimit:innerWidth<600?6:10},grid:{color:'rgba(255,255,255,.03)'}},y:{ticks:{color:'#6b6b80',maxTicksLimit:5,callback:v=>'R$'+Number(v).toLocaleString('pt-BR')},grid:{color:'rgba(255,255,255,.04)'}}}}})}window.addEventListener('DOMContentLoaded',()=>{if(window.lucide)lucide.createIcons();calcular();['iInicial','iMeta','iStop','iDia'].forEach(id=>document.getElementById(id).addEventListener('input',calcular))});
</script></body></html>
